services:
  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: loan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: eligibility_policy_Configuration_V1
      MYSQL_USER: eligibility_reader
      MYSQL_PASSWORD: reader_secure_pass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  app:
    image: loan-eligibility-engine-app:latest
    pull_policy: never
    container_name: loan-eligibility-engine
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eligibility_policy_Configuration_V1?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: eligibility_reader
      SPRING_DATASOURCE_PASSWORD: reader_secure_pass