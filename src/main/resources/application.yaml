spring:
  application:
    name: loan-eligibility-engine
  datasource:
    url: jdbc:mysql://localhost:3307/eligibility_policy_Configuration_V1?useSSL=false&serverTimezone=UTC
    username: eligibility_reader
    password: reader_secure_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          connection.read_only: true
server:
  port: 8001

eligibility:
  loan:
    annual-interest-rate: 21.5
    max-active-loans : 2
  rules:
    min-age: 21
    max-age-at-maturity: 65
    min-credit-score: 600
    min-salary: 5000
    min-tenure-months: 12
    max-tenure-months: 96
    min-amount: 10000
    max-amount: 1000000
    max-income-multiple: 30
    min-residual-income: 3000
    max-maturity-age: 65
    max-ratio: 45.0
    tier:
      premium-score: 700
      standard-max-amount: 300000

